version: 2
project_name: perago
builds:
  - main: ./cmd/perago
    binary: perago
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{.Version}}']
archives:
  - formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    files: [LICENSE, README.md, CHANGELOG.md]
checksum:
  name_template: checksums.txt
changelog:
  disable: true # release notes come from CHANGELOG.md
release:
  github: { owner: LouisRiverstone, name: perago }
