# Documentation site for GitHub Pages, built by .github/workflows/docs.yml.
title: perago
description: Laravel's queues for Go. Jobs, workers, retries, chains, batches and failed jobs on every migro database, Redis, SQS and Beanstalkd.
url: https://louisriverstone.github.io
baseurl: /perago

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

search_enabled: true
heading_anchors: true
color_scheme: light

aux_links:
  GitHub: https://github.com/LouisRiverstone/perago
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/LouisRiverstone/perago
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: 'perago is MIT licensed. <a href="https://github.com/LouisRiverstone/perago">Source on GitHub</a>.'

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

exclude:
  - build-versions.sh
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
